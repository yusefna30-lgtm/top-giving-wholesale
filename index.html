<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP GIVING | المتجر الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --black: #000; --card-bg: #0c0c0e; --accent: #1a1a1a; }
        body { font-family: 'Cairo', sans-serif; background: var(--black); color: #fff; text-align: center; margin: 0; padding-bottom: 130px; }
        .header { padding: 20px 10px; background: #000; border-bottom: 1px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
        .brand-logo { max-height: 100px; width: auto; display: block; margin: 0 auto 15px; filter: drop-shadow(0 0 5px var(--gold)); }
        .nav-tabs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .tab { background: #111; color: #fff; padding: 10px 20px; border-radius: 25px; border: 1px solid var(--accent); cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .tab.active { background: var(--gold); color: #000; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 1200px; margin: 0 auto; padding: 0 12px; }
        @media (min-width: 992px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        
        .card { background: var(--card-bg); padding: 15px; border-radius: 18px; border: 1px solid var(--accent); display: flex; flex-direction: column; align-items: center; transition: all 0.3s ease; position: relative; }
        .card:hover { box-shadow: 0 0 20px var(--gold); border-color: var(--gold); transform: translateY(-2px); }
        .img-box { width: 100%; height: 220px; border-radius: 12px; overflow: hidden; background: #fff; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; position: relative; }
        .product-img { max-width: 100%; max-height: 100%; object-fit: contain; transform: scale(1.1); transition: transform 0.3s ease; }
        .img-box:hover .product-img { transform: scale(1.5); }
        
        .arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.5); color: var(--gold); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 1.2rem; font-weight: bold; cursor: pointer; user-select: none; transition: 0.3s; z-index: 10; }
        .arrow:hover { background: var(--gold); color: #000; box-shadow: 0 0 10px var(--gold); transform: translateY(-50%) scale(1.1); }
        .arrow-right { right: 8px; }
        .arrow-left { left: 8px; }
        
        .model-info { margin-bottom: 12px; width: 100%; text-align: center; }
        .item-cat { color: #aaa; font-size: 0.85rem; }
        .item-mod { color: #fff; font-weight: bold; font-size: 1rem; margin-top: 2px; }

        .qty-control { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; background: #1a1a1a; padding: 8px; border-radius: 10px; width: 100%; box-sizing: border-box; }
        .btn-q { background: #252525; color: #fff; border: 1px solid var(--gold); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; }
        .btn-add { background: linear-gradient(135deg, #D4AF37, #8A6D3B); color: #000; padding: 12px; border-radius: 10px; font-weight: 900; border: none; width: 100%; cursor: pointer; }
        
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.95); border-top: 2px solid var(--gold); padding: 15px; display: none; z-index: 1001; }
        .cart-flex { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .btn-clear { background: #333; color: #fff; border: 1px solid #555; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-family: 'Cairo'; }

        .top-giving-footer { background-color: #1a1a1a; color: #fff; padding: 30px 20px 15px; font-size: 12px; clear: both; width: 100%; box-sizing: border-box; }
        .footer-container { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-around; }
        .footer-column { flex: 1; min-width: 220px; margin-bottom: 15px; padding: 0 15px; }
        .footer-column h3 { color: var(--gold); font-size: 13px; border-bottom: 1px solid #333; padding-bottom: 6px; }
        .footer-column p { margin: 6px 0; color: #ccc; }
        .footer-column a { color: #fff; text-decoration: none; }
        .footer-bottom { border-top: 1px solid #333; padding-top: 15px; color: #888; font-size: 11px; margin-top: 20px; }
        @media (max-width: 768px) { .footer-container { display: block; } .footer-column { width: 100%; padding: 0; margin-bottom: 20px; } }
    </style>
</head>
<body>

<div class="header">
    <img src="TOP%20GIVING%20logo.jpg" alt="TOP GIVING" class="brand-logo">
    <div class="nav-tabs">
        <div class="tab active" onclick="filterCategory('hoodie', this)">هودي رجالي</div>
        <div class="tab" onclick="filterCategory('set', this)">أطقم صيفية</div>
        <div class="tab" onclick="filterCategory('shorts', this)">شورتات</div>
        <div class="tab" onclick="filterCategory('pants', this)">بنطلونات</div>
        <div class="tab" onclick="filterCategory('shirts', this)">قميص</div>
    </div>
</div>

<div class="grid" id="products-container"></div>

<div class="cart-bar" id="cart-bar">
    <div class="cart-flex">
        <div id="cart-info" style="color:var(--gold); font-weight:bold;">الإجمالي: 0 حبة</div>
        <div style="display:flex; gap:10px;">
            <button class="btn-clear" onclick="clearCart()">تصفير السلة 🗑️</button>
            <button class="btn-add" style="width:auto; padding:8px 20px;" onclick="send()">إرسال ✅</button>
        </div>
    </div>
</div>

<footer class="top-giving-footer">
    <div class="footer-container">
        <div class="footer-column">
            <h3>التوثيق القانوني</h3>
            <p>رقم السجل التجاري: <span style="font-family: monospace;">1009026155</span></p>
            <p>الرقم الضريبي: <span style="font-family: monospace;">300777492300003</span></p>
        </div>
        <div class="footer-column">
            <h3>قنوات التواصل الرسمية</h3>
            <p>📞 للاتصالات والاستفسار: <a href="tel:0508444637" dir="ltr">050 844 4637</a></p>
            <p>✉️ البريد الإلكتروني: <a href="mailto:twbjyfynj@gmail.com">twbjyfynj@gmail.com</a></p>
        </div>
    </div>
    <div class="footer-bottom">
        <p>حقوق النشر © Top Giving. جميع الحقوق محفوظة 2026.</p>
    </div>
</footer>

<script>
    // قائمة المنتجات: يمكنك إضافة أي موديل جديد مستقبلاً بإضافة سطر واحد فقط هنا
    const products = [
        { 
            id: 'hd01', 
            cat: 'hoodie', 
            name: 'هودي سحاب HD-01', 
            model: 'HD-01', 
            desc: 'هودي سحاب رجالي', 
            qtyStep: 12, 
            images: ['hd01-1.jpg', 'hd01-2.webp', 'hd01-3.webp', 'hd01-4.webp'] 
        }
    ];

    function filterCategory(cat, tabBtn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if(tabBtn) tabBtn.classList.add('active');

        const container = document.getElementById('products-container');
        container.innerHTML = '';

        const filtered = products.filter(p => p.cat === cat);
        filtered.forEach(p => {
            const hasMultiple = p.images.length > 1;
            const arrows = hasMultiple ? `
                <span class="arrow arrow-right" onclick="navImg(this, 1)">&gt;</span>
                <span class="arrow arrow-left" onclick="navImg(this, -1)">&lt;</span>
            ` : '';

            const cardHtml = `
                <div class="card" data-images="${p.images.join(',')}" data-index="0">
                    <div class="img-box">
                        ${arrows}
                        <img src="${p.images[0]}" class="product-img">
                    </div>
                    <div class="model-info">
                        <div class="item-cat">الصنف: ${p.desc}</div>
                        <div class="item-mod">موديل: ${p.model}</div>
                    </div>
                    <div class="qty-control">
                        <button class="btn-q" onclick="c('qty-${p.id}', ${p.qtyStep})">+</button>
                        <span id="qty-${p.id}">${p.qtyStep}</span>
                        <button class="btn-q" onclick="c('qty-${p.id}', -${p.qtyStep})">-</button>
                    </div>
                    <button class="btn-add" onclick="add('${p.name}', 'qty-${p.id}', this)">إضافة للطلب</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        });
    }

    function navImg(btn, dir) {
        let card = btn.closest('.card');
        let imgs = card.getAttribute('data-images').split(',');
        let currIdx = parseInt(card.getAttribute('data-index') || 0);
        currIdx += dir;
        if (currIdx < 0) currIdx = imgs.length - 1;
        if (currIdx >= imgs.length) currIdx = 0;
        card.setAttribute('data-index', currIdx);
        card.querySelector('.product-img').src = imgs[currIdx].trim();
    }

    function c(elementId, changeAmount) {
        let el = document.getElementById(elementId);
        if(!el) return;
        let minVal = Math.abs(changeAmount);
        let current = parseInt(el.textContent.trim()) || minVal;
        let next = current + changeAmount;
        if (next < minVal) next = minVal;
        el.textContent = next;
    }

    let order = [];
    function add(name, qtyId, btn) { 
        let qty = parseInt(document.getElementById(qtyId).innerText); 
        order.push({ name: name, qty: qty }); 
        document.getElementById('cart-bar').style.display = 'block'; 
        updateTotal(); 
        btn.innerText = "تمت ✅"; 
        setTimeout(() => btn.innerText = "إضافة للطلب", 1500); 
    }

    function updateTotal() { 
        let total = order.reduce((sum, i) => sum + i.qty, 0); 
        document.getElementById('cart-info').innerText = `الإجمالي: ${total} حبة`; 
    }

    function clearCart() { 
        order = []; 
        document.getElementById('cart-bar').style.display = 'none'; 
    }

    function send() { 
        if(order.length === 0) return; 
        let msg = "📦 *طلب جديد من TOP GIVING* 📦\n\n"; 
        order.forEach(i => { msg += `• *${i.name}*: ${i.qty} حبة\n`; }); 
        window.open(`https://wa.me/966560564719?text=${encodeURIComponent(msg)}`, '_blank'); 
    }

    window.onload = () => filterCategory('hoodie', document.querySelector('.tab.active'));
</script>
</body>
</html>
